            <ul>

                <li><a href="about.html">.｡*ﾟ+.*.｡ﾟ 　Sobre Mí　+..｡*ﾟ+</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <h1>Contáctame</h1>
        <form action="#" method="post">
            <p>
                <label for="nombre">Nombre Completo:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </p>

            <p>
                <label for="email">Correo Electrónico:</label><br>
                <input type="email" id="email" name="email" 
                       pattern="[a-z0-0._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" 
                       placeholder="ejemplo@correo.com" required>
            </p>

            <p>
                <label for="telefono">Teléfono (10 dígitos):</label><br>
                <input type="tel" id="telefono" name="telefono" 
                       pattern="[0-9]{10}" placeholder="6441234567" required>
            </p>

            <p>
                <label for="edad">Edad:</label><br>
                <input type="number" id="edad" name="edad" min="18" max="99">
            </p>

            <p>
                <label for="fecha">Fecha de Interés:</label><br>
                <input type="date" id="fecha" name="fecha">
            </p>

            <fieldset>
                <legend>Tipo de consulta:</legend>
                <input type="radio" id="vacante" name="tipo" value="vacante">
                <label for="vacante">Propuesta Laboral</label><br>
                <input type="radio" id="proyecto" name="tipo" value="proyecto">
                <label for="proyecto">Colaboración en Proyecto</label>
            </fieldset>

            <p>
                <label for="prioridad">Prioridad:</label><br>
                <select id="prioridad" name="prioridad">
                    <option value="baja">Baja</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                </select>
            </p>

            <p>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="4" cols="30" placeholder="Escribe aquí..."></textarea>
            </p>

            <button type="submit">Enviar</button>
            <button type="reset">Limpiar Formulario</button>
        </form>
    </main>
</body>
</html>
