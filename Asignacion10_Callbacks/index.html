<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantump Forest Ritual 🕯️</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div id="phantump-loader" class="center">
        <div class="horn left"><div class="leaf"></div></div>
        <div class="horn right"><div class="leaf"></div></div>
        
        <div class="head">
            <div class="eye-socket left"><div class="eye-glow"></div></div>
            <div class="eye-socket right"><div class="eye-glow"></div></div>
            <div class="mouth-hole"></div>
        </div>

        <div class="ghost-core">
            <div class="spirit-arm left"></div>
            <div class="spirit-arm right"></div>
            <div class="spirit-tail"></div>
        </div>
    </div>

    <div class="mistic-container">
        <h1>Ritual Fantasma</h1>
        <p class="status">El bosque aguarda tu señal...</p>
        
        <div class="key-trigger">
            <p>Presiona la tecla</p>
            <kbd>F</kbd>
        </div>

        <div class="console-hint">
            ⚠️ Revisa la <b>Consola (F12)</b> para ver la magia de los callbacks.
        </div>
    </div>

    <script src="logica.js"></script>
</body>
</html>
